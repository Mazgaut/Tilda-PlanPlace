name: Mirror to GitVerse

on:
  push:
    branches: ['**']

jobs:
  mirror:
    # This workflow is copied to GitVerse together with the repository. Run it
    # only in the source GitHub repository; GitVerse is the mirror target.
    if: github.repository_owner == 'Mazgaut'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitVerse
        run: |
          git remote add gitverse https://alexberez:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/max41125/PlanPlace-information.git
          git push gitverse HEAD:refs/heads/master --force
